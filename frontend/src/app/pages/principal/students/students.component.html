<div class="page-head">
  <div>
    <p class="page-head__eyebrow">Hiệu trưởng</p>
    <h1>Quản lý Sinh viên</h1>
  </div>
  <button class="btn btn-gold" (click)="openAddForm()">+ Thêm sinh viên</button>
</div>

<app-student-filter-bar
  (search)="onFilterSearch($event)"
  (reset)="onFilterReset()"
></app-student-filter-bar>

<app-student-table
  [students]="students()"
  [loading]="loadingList()"
  (rowClick)="openDetail($event)"
  (createAccountClick)="openCreateAccount($event)"
></app-student-table>

@if (totalPages() > 1) {
  <div class="pagination-bar">
    <button class="btn btn-ghost" [disabled]="currentPage() === 1" (click)="changePage(-1)">← Trước</button>
    <span class="pagination-bar__label">Trang {{ currentPage() }} / {{ totalPages() }}</span>
    <button class="btn btn-ghost" [disabled]="currentPage() === totalPages()" (click)="changePage(1)">Sau →</button>
  </div>
}

@if (selectedStudent(); as s) {
  <app-student-detail-drawer
    [student]="s"
    [enrolledSubjects]="enrolledSubjects()"
    [loading]="loadingDetail()"
    (closed)="closeDetail()"
  ></app-student-detail-drawer>
}

@if (showAddForm()) {
  <app-add-student-modal
    [saving]="addingStudent()"
    [error]="addError()"
    (submit)="submitAddStudent($event)"
    (cancel)="showAddForm.set(false)"
  ></app-add-student-modal>
}

@if (creatingAccountFor(); as student) {
  <app-create-account-modal
    [student]="student"
    [saving]="creatingAccount()"
    [error]="accountError()"
    (submit)="submitCreateAccount($event)"
    (cancel)="creatingAccountFor.set(null)"
  ></app-create-account-modal>
}
