@if (student) {
  <div class="detail-panel">
    <h3>Chi tiết sinh viên</h3>
    <p><strong>Mã SV:</strong> {{ student.code }}</p>
    <p><strong>Họ tên:</strong> {{ student.fullName }}</p>
    <p><strong>Giới tính:</strong> {{ student.gender }}</p>
    <p><strong>Ngày sinh:</strong> {{ student.dateOfBirth }}</p>
    <p><strong>Lớp:</strong> {{ student.classroom }}</p>
    <p><strong>Khóa:</strong> {{ student.cohort }}</p>

    <app-student-subjects [studentId]="student.id"></app-student-subjects>
    <app-student-scores [studentId]="student.id"></app-student-scores>
  </div>
} @else {
  <div class="detail-empty">
    <p>👈 Chọn một sinh viên trong bảng để xem chi tiết</p>
  </div>
}
