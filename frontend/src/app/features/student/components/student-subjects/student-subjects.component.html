<div class="subjects-box">
  <h4>Môn học đã đăng ký</h4>

  @if (registeredSubjects.length > 0) {
    <ul>
      @for (subject of registeredSubjects; track subject.id) {
        <li>
          {{ subject.name }} — {{ subject.totalLesson }} tiết
        </li>
      }
    </ul>
  } @else {
    <p>Sinh viên chưa đăng ký môn học nào.</p>
  }
</div>
