<div class="card table-card">
  <table class="table">
    <thead>
      <tr>
        <th>Mã SV</th>
        <th>Họ tên</th>
        <th>Lớp</th>
        <th>Khóa</th>
        <th>Tài khoản</th>
      </tr>
    </thead>
    <tbody>
      @if (loading) {
        <tr><td colspan="5" class="table__empty">Đang tải...</td></tr>
      } @else {
        @for (student of students; track student.id) {
          <tr (click)="rowClick.emit(student)" class="table__row">
            <td class="mono">{{ student.code }}</td>
            <td class="table__name">{{ student.fullName }}</td>
            <td>{{ student.classroom }}</td>
            <td>{{ student.cohort }}</td>
            <td>
              @if (student.accountId) {
                <span class="badge badge-pass">Đã có</span>
              } @else {
                <button class="btn btn-ghost" style="padding:5px 10px;font-size:0.76rem"
                  (click)="createAccountClick.emit({ student, event: $event })">
                  Tạo tài khoản
                </button>
              }
            </td>
          </tr>
        } @empty {
          <tr><td colspan="5" class="table__empty">Không tìm thấy sinh viên phù hợp.</td></tr>
        }
      }
    </tbody>
  </table>
</div>
