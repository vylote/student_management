<div class="login-card card">
  <div class="login-card__brand">
    <span class="login-card__seal">HS</span>
    <div>
      <h1>Hệ thống Quản lý Học vụ</h1>
      <p>Đăng nhập để tiếp tục</p>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="login-card__form">
    <label class="field">
      <span>Tài khoản</span>
      <input
        class="input"
        type="text"
        name="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        placeholder="Tên đăng nhập"
        autocomplete="username"
      />
    </label>

    <label class="field">
      <span>Mật khẩu</span>
      <input
        class="input"
        type="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="Mật khẩu"
        autocomplete="current-password"
      />
    </label>

    @if (errorMessage()) {
      <p class="login-card__error">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      class="btn btn-gold login-card__submit"
      [disabled]="loading()"
    >
      {{ loading() ? "Đang đăng nhập…" : "Đăng nhập" }}
    </button>
  </form>

</div>
